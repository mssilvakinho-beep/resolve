services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://resolve:${POSTGRES_PASSWORD}@db:5432/resolve
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      RESOLVE_WEBHOOK_TOKEN: ${RESOLVE_WEBHOOK_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    ports: ["8787:8787"]
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: resolve
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [resolve_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U resolve -d resolve"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  resolve_pg:
